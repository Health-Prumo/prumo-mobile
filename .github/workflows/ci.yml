name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Confere que o APK compila com o prumo-web da tag em prumo-web.ref.
  # Sem a chave de assinatura: gera só o APK de teste (debug).
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Variáveis do front (valores públicos de exemplo)
        run: cp .env.example .env.production

      - name: Build do APK de teste
        run: scripts/build.sh debug

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLI direto: a gitleaks-action exige licença paga em repositórios de organização.
      - name: Gitleaks
        env:
          VERSAO: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
